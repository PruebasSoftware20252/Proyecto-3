plugins {
    id 'java'
    id 'application'
    id "com.microsoft.azure.azurewebapp" version "1.10.0"
    id 'jacoco'
    id 'org.sonarqube' version '4.4.1.3373'
}

group = 'com.inventario'
version = '1.0.0'

repositories { mavenCentral() }

dependencies {
    // --- JUnit 5 (Jupiter) ---
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Recomendado para Gradle 8.x en CI (GitHub Actions)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Cucumber + JUnit Platform (NO uses JUnit4)
    testImplementation 'io.cucumber:cucumber-java:7.15.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.15.0'

    // Selenium + WebDriverManager
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.23.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.2'

    testImplementation 'org.junit.platform:junit-platform-suite-api:1.10.2'

}
test {
    useJUnitPlatform()
    useJUnitPlatform { excludeTags 'e2e' }
    useJUnitPlatform()
    testLogging { showStandardStreams = true }
    systemProperty "file.encoding", "UTF-8"
    useJUnitPlatform()
    reports {
        junitXml.required.set(true)
        html.required.set(true)
    }

}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
    finalizedBy 'jacocoTestReport'
    systemProperty 'file.encoding', 'UTF-8'
    jvmArgs '-Dfile.encoding=UTF-8', '-Duser.language=es', '-Duser.region=CO'
}

jacoco {
    toolVersion = "0.8.10"
}

tasks.jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    dependsOn tasks.test
}

application {
    // Arranque del servidor HTTP embebido
    mainClass = 'com.inventario.web.WebServer'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

sonarqube {
    properties {
        property "sonar.gradle.skipCompile", "true"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
