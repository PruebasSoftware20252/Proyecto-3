name: CI/CD Gradle + SonarCloud + Azure

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  SONAR_HOST_URL: 'https://sonarcloud.io'
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }} 

jobs:
  build_test_and_sonar:
    name: Build, Test & SonarCloud (Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build & Test + Coverage + Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew clean test jacocoTestReport sonar -Dsonar.organization=pruebassoftware20252 -Dsonar.projectKey=pruebassoftware20252 -Dsonar.host.url=${{ env.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }} -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

  deploy:
    name: Deploy to Azure App Service
    needs: build_test_and_sonar
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Package JAR
        run: ./gradlew clean jar --no-daemon

      - name: Show artifact before deploy
        run: |
          echo "Deploying to: ${{ env.AZURE_WEBAPP_NAME }}"
          ls -lh build/libs/

      - name: Prepare ZIP for ZipDeploy
        run: |
          rm -f app.zip
          zip -j app.zip build/libs/*.jar

      - name: Extract Kudu credentials from publish profile
        shell: bash
        run: |
          xml='${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}'
          KUDU_URL=$(echo "$xml" | sed -n 's/.*publishUrl="\([^"]*\)".*/\1/p' | head -n1)
          KUDU_USER=$(echo "$xml" | sed -n 's/.*userName="\([^"]*\)".*/\1/p' | head -n1)
          KUDU_PASS=$(echo "$xml" | sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' | head -n1)
          echo "KUDU_URL=$KUDU_URL" >> $GITHUB_ENV
          echo "KUDU_USER=$KUDU_USER" >> $GITHUB_ENV
          echo "KUDU_PASS=$KUDU_PASS" >> $GITHUB_ENV

      - name: ZipDeploy to Kudu
        run: |
          curl -sS -u "${KUDU_USER}:${KUDU_PASS}" \
            -H "Content-Type: application/zip" \
            --data-binary @app.zip \
            https://${KUDU_URL}/api/zipdeploy
