name: CI/CD Gradle + SonarCloud + Azure

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  SONAR_HOST_URL: 'https://sonarcloud.io'
  AZURE_WEBAPP_NAME: CP-TAREA-5

jobs:
  build_test_and_sonar:
    name: Build, Test & SonarCloud (Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build & Test + Coverage
        run: ./gradlew clean test jacocoTestReport --no-daemon

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./gradlew sonar
          -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
          -Dsonar.organization=pruebassoftware20252
          -Dsonar.projectKey=pruebassoftware20252
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
          -Dsonar.gradle.skipCompile=true
          --no-daemon

  deploy:
    name: Deploy to Azure App Service (ZipDeploy)
    needs: build_test_and_sonar
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build JAR
        run: ./gradlew clean build -x test --no-daemon

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp build/libs/*.jar deploy/
          cd deploy
          zip -r ../app.zip .
          cd ..
          ls -lh app.zip

      - name: Extract Kudu credentials
        shell: bash
        run: |
          xml='${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}'
          echo "$xml" > profile.xml
          KUDU_URL=$(grep -oP '(?<=publishUrl=")[^"]*' profile.xml | head -n1)
          KUDU_USER=$(grep -oP '(?<=userName=")[^"]*' profile.xml | head -n1)
          KUDU_PASS=$(grep -oP '(?<=userPWD=")[^"]*' profile.xml | head -n1)
          echo "KUDU_URL=$KUDU_URL" >> $GITHUB_ENV
          echo "KUDU_USER=$KUDU_USER" >> $GITHUB_ENV
          echo "KUDU_PASS=$KUDU_PASS" >> $GITHUB_ENV

      - name: ZipDeploy to Azure
        run: |
          curl -sS -u "${KUDU_USER}:${KUDU_PASS}" \
            -H "Content-Type: application/zip" \
            --data-binary @app.zip \
            https://${KUDU_URL}/api/zipdeploy
