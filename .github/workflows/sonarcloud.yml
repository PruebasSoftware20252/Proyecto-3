name: CI/CD Gradle + SonarCloud + Azure (ZipDeploy)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  SONAR_HOST_URL: 'https://sonarcloud.io'
  AZURE_WEBAPP_NAME: CP-TAREA-5

jobs:
  build_test_and_sonar:
    name: Build, Test & SonarCloud (Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build & Test + Coverage
        run: ./gradlew clean test jacocoTestReport --no-daemon

      - name: SonarCloud (Gradle sonar)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./gradlew sonar
          -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
          -Dsonar.organization=pruebassoftware20252
          -Dsonar.projectKey=pruebassoftware20252
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
          -Dsonar.gradle.skipCompile=true
          --no-daemon
  deploy:
    name: Deploy to Azure App Service (ZipDeploy)
    needs: build_test_and_sonar
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Empaquetar el JAR
      - name: Build JAR
        run: ./gradlew clean build -x test --no-daemon

      # Preparar carpeta de deploy con SOLO el jar
      - name: Copy JAR to deploy directory
        run: |
          mkdir -p deploy
          cp build/libs/*.jar deploy/
          ls -lh deploy/
      # Crear un ZIP para ZipDeploy
      - name: Create zip
        run: |
          cd deploy
          zip -r ../app.zip .
          cd ..
          ls -lh app.zip
      # Extraer credenciales Kudu del publish profile (XML)
      - name: Extract Kudu credentials from publish profile
        shell: bash
        run: |
          xml='${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}'
          KUDU_URL=$(echo "$xml" | sed -n 's/.*publishUrl="\([^"]*\)".*/\1/p' | head -n1)
          KUDU_USER=$(echo "$xml" | sed -n 's/.*userName="\([^"]*\)".*/\1/p' | head -n1)
          KUDU_PASS=$(echo "$xml" | sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' | head -n1)
          echo "KUDU_URL=$KUDU_URL" >> $GITHUB_ENV
          echo "KUDU_USER=$KUDU_USER" >> $GITHUB_ENV
          echo "KUDU_PASS=$KUDU_PASS" >> $GITHUB_ENV
      - name: ZipDeploy to Kudu
        run: |
          curl -sS -u "${KUDU_USER}:${KUDU_PASS}" \
            -H "Content-Type: application/zip" \
            --data-binary @app.zip \
            https://${KUDU_URL}/api/zipdeploy
