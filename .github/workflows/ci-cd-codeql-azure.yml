name: CI/CD Gradle + CodeQL + Azure

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: '17'
  AZURE_WEBAPP_NAME: CP-TAREA-5   # Puedes dejar el literal para evitar confusiones

jobs:
  build_test:
    name: Build & Test (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Build & Test
        run: ./gradlew clean build --no-daemon

  codeql:
    name: Code Scanning (CodeQL)
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

  deploy:
    name: Deploy to Azure App Service
    needs: [build_test, codeql]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Package (Gradle)
        run: ./gradlew clean jar --no-daemon
      - name: Show target & artifact
        run: |
          echo "App name: ${{ env.AZURE_WEBAPP_NAME }}"
          ls -lh build/libs/
      - name: Deploy JAR to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: build/libs/*.jar
