name: CI/CD Gradle + CodeQL + Azure

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: '17'
  AZURE_WEBAPP_NAME: CP-TAREA-5   # Puedes dejar el literal para evitar confusiones

jobs:
  build_test:
    name: Build & Test (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Build & Test
        run: ./gradlew clean build --no-daemon

  codeql:
    name: Code Scanning (CodeQL)
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

