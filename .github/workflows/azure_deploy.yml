# .github/workflows/deploy-azure.yml
name: Build & Deploy to Azure Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: CP-TAREA-5
  AZURE_RESOURCE_GROUP: YOUR-RG-NAME
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew


      - name: Build (Gradle)
        run: ./gradlew --no-daemon clean build

      - name: Locate jar
        id: jar
        run: |
          JAR_PATH="$(ls build/libs/*.jar | head -n 1)"
          echo "JAR_PATH=$JAR_PATH" >> $GITHUB_ENV
          echo "path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Upload artifact for deploy
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: ${{ steps.jar.outputs.path }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.__clientidsecretname__ }}
          tenant-id: ${{ secrets.__tenantidsecretname__ }}
          subscription-id: ${{ secrets.__subscriptionidsecretname__ }}


      - name: Ensure App Settings (WEBSITES_PORT=8080, JAVA 17)
        if: env.AZURE_RESOURCE_GROUP != ''
        run: |
          az webapp config appsettings set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings WEBSITES_PORT=8080
          # Si tu App Service es Java SE, no hace falta cambiar el "Stack" aquí.
          # El Startup Command lo fijamos en el paso de deploy.

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: '*.jar'

          startup-command: 'java -jar /home/site/wwwroot/*.jar'

      - name: Logout Azure
        if: always()
        run: az logout
